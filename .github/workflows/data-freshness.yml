name: Production data freshness

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-data-freshness
  cancel-in-progress: false

jobs:
  check-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
      - name: Check deployed data and report to Sentry
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: node scripts/check-data-freshness.js
