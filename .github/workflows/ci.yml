name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: lint-and-unit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: CI=true npm run build

      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Unit tests
        run: CI=true npm test -- --watchAll=false

      - name: Server tests
        run: npx jest --config jest.server.config.js --runInBand

  # The data-refresh runner is a Windows machine that runs this server suite
  # before every data commit, so a test that fails only on Windows silently
  # stops production data updates. Run the same suite on Windows here so that
  # failure shows up on the pull request instead.
  server-windows:
    name: server-windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm

      # Server tests need no browser, so skip the Puppeteer Chrome postinstall.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Server tests
        run: npx jest --config jest.server.config.js --runInBand

  e2e:
    name: e2e
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Playwright tests
        run: npx playwright test --project=api --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
